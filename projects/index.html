<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page-container">
        <form class="registration-form" action="">
            <div class="form-header">
                <p class="eyebrow">STUDENT PORTAL</p>
                <h1>Student Registration</h1>
                <p class="subtitle">Create your student account by completing the form below.</p>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password">
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob">
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" name="department">
                        <option value="">Select Department</option>
                        <option value="computer-engineering">Computer Engineering</option>
                        <option value="electrical-engineering">Electrical Engineering</option>
                        <option value="mechanical-engineering">Mechanical Engineering</option>
                        <option value="civil-engineering">Civil Engineering</option>
                    </select>
                </div>

                <fieldset class="choice-group">
                    <legend>Gender</legend>
                    <label class="choice-label" for="male">
                        <input type="radio" id="male" name="gender" value="Male">
                        Male
                    </label>
                    <label class="choice-label" for="female">
                        <input type="radio" id="female" name="gender" value="Female">
                        Female
                    </label>
                </fieldset>

                <fieldset class="choice-group">
                    <legend>Interests</legend>
                    <label class="choice-label" for="coding">
                        <input type="checkbox" id="coding" name="interests" value="Coding">
                        Coding
                    </label>
                    <label class="choice-label" for="reading">
                        <input type="checkbox" id="reading" name="interests" value="Reading">
                        Reading
                    </label>
                    <label class="choice-label" for="music">
                        <input type="checkbox" id="music" name="interests" value="Music">
                        Music
                    </label>
                </fieldset>

                <div class="form-group full-width">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="4" placeholder="Enter your address"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <input class="register-button" type="submit" value="Register">
                <input class="clear-button" type="reset" value="Clear Form">
            </div>

            <p class="login-prompt">Already have an account? <a href="login.html">Login</a></p>
        </form>
    </main>
</body>

</html>
